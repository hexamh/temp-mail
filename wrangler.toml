name       = "tempmail"
main       = "src/index.ts"
compatibility_date  = "2026-04-29"
compatibility_flags = ["nodejs_compat"]

[triggers]
# Runs every 5 minutes to sweep expired D1 sessions (KV handles its own TTL natively)
crons = ["*/5 * * * *"]

[[d1_databases]]
binding       = "TEMPMAIL_DB"
database_name = "temp"
database_id   = "85a32f88-865b-49a5-b18d-521c334ba38c"

[[kv_namespaces]]
binding    = "TEMPMAIL_KV"
id         = "305bed38102e467b9fd28b79c608b30e"
preview_id = "305bed38102e467b9fd28b79c608b30e"

[vars]
ALLOWED_DOMAINS    = "mail.drkingbd.cc,drkingbd.cc"
INBOX_TTL_SECONDS  = "600"              

[env.production]
vars = { ALLOWED_DOMAINS = "mail.drkingbd.cc,drkingbd.cc", INBOX_TTL_SECONDS = "600" }
